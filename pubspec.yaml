name: pg_hostel_management
description: A PG/Hostel Management Application for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^16.2.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local data storage
  shared_preferences: ^2.3.2

  # PDF reports (generate + download/share)
  pdf: ^3.11.1
  printing: ^5.13.4

  # UI / utilities
  intl: any  # version is pinned by flutter_localizations
  equatable: ^2.0.5
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  file_selector: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_512.png

# App launcher icon. CI runs `dart run flutter_launcher_icons` after
# generating the android/ folder.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon_1024.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  # Foreground image already keeps the house inside the safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
