name: pg_hostel_management
description: A PG/Hostel Management Application for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_localizations:
  cupertino_icons: ^1.0.6

  # State Management
  riverpod: ^2.5.1
  riverpod_annotation: ^2.3.1

  # Navigation
  go_router: ^13.2.1

  # Local Database
  drift: ^2.18.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI
  material_design_icons_flutter: ^7.0.8
  intl: ^0.19.0
  equatable: ^2.0.5

  # PDF Generation
  pdf: ^3.11.0
  printing: ^5.13.0

  # CSV Export
  csv: ^5.0.0

  # Local Notifications
  flutter_local_notifications: ^16.0.1

  # Form Validation
  validatorator: ^3.0.0

  # Connectivity
  connectivity_plus: ^5.0.0

  # Caching
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  drift_generator: ^2.30.1
  riverpod_generator: ^2.4.5

flutter:
  uses-material-design: true

  # Enable material 3
  assets:
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Regular.ttf
        - asset: fonts/Roboto/Roboto-Medium.ttf
        - asset: fonts/Roboto/Roboto-Bold.ttf