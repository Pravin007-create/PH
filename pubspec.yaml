name: pg_hostel_management
description: A PG/Hostel Management Application for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # UI / utilities
  intl: any  # version is pinned by flutter_localizations
  equatable: ^2.0.5

  # Add these back when the code actually uses them:
  # drift, sqflite, path_provider, pdf, printing, csv,
  # flutter_local_notifications, connectivity_plus, shared_preferences

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
