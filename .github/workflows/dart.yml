
name: Build Flutter Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Android Gradle Plugin's lint needs Java 21 (it crashes on Java 17 with
      # "NoSuchMethodError: List.removeLast()").
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Skip the release "lint vital" check for all modules (including
      # plugins). It only reports lint warnings and has crashed on plugin code.
      - name: Disable release lint check
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint-vital.gradle <<'EOF'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith('lintVital')) {
                      t.enabled = false
                  }
              }
          }
          EOF
          flutter config --jdk-dir="$JAVA_HOME"

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name pg_hostel_management --org com.pghostel .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Set app name and launcher icon
        run: |
          sed -i 's/android:label="[^"]*"/android:label="PG Management"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="PG Management"' android/app/src/main/AndroidManifest.xml || { echo "App name was not set"; exit 1; }
          dart run flutter_launcher_icons

      - name: Check Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PG-Hostel-Management-APK
          path: build/app/outputs/flutter-apk/app-release.apk
